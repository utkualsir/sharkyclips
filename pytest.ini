[pytest]
testpaths = backend/tests
addopts = -q -p no:cacheprovider
# 1.2.64: no .pytest_cache in the repo. pytest's cache writer cleans up a temp folder it makes in
# the repo root with shutil.rmtree, which the tests' safe-delete guard (correctly) refuses: CI failed
# at the very end of a green run (1.2.63).
markers =
    requires_ffmpeg: needs ffmpeg on PATH (skipped cleanly when it is missing)
filterwarnings =
    ignore:\s*on_event is deprecated:DeprecationWarning
