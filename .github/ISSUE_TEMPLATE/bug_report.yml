name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Issues are **public**: please don't attach private videos, links to private content, passwords or log files with personal data. A short description is enough.
        Tip: in SharkyClips, *Settings → About → Send feedback* (or *Report* in an error message) fills in the version and your system for you.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a 2 h Twitch VOD in Easy mode
        2. Click "Share" on the first clip
        3. ...
  - type: input
    id: version
    attributes:
      label: SharkyClips version
      description: Shown in Settings → About (e.g. 1.2.74)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Windows 10, macOS 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Easy mode, Pro mode, Not sure]
  - type: input
    id: hardware
    attributes:
      label: GPU / RAM (optional)
      placeholder: e.g. RTX 3060 12 GB, 16 GB RAM, or "no GPU"
  - type: textarea
    id: logs
    attributes:
      label: Error message or anything else (optional)
      description: Paste the exact error text if there is one. Please remove names, paths and links you don't want to be public.
      render: text
  - type: input
    id: source
    attributes:
      label: Sent from
      description: Filled in automatically (app or website); leave it as it is.
