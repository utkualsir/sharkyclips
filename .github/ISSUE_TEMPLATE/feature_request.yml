name: Feature request
description: Suggest an idea for SharkyClips
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Highlight detection, AI titles / scores, Rendering / subtitles, Web UI, Installer / updates, Languages, Other]
