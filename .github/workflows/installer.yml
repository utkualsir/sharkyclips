name: Windows installer

# 1.2.56: on every version tag, build the one-click installer on a clean Windows runner, install it
# silently, start it like a double-click, check the UI / doctor / a CPU render, uninstall it, then
# attach SharkyClips-Setup-<v>.exe + .sha256 to that tag's GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Build, install, smoke test, uninstall
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # no token left in .git/config for later steps
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "VERSION $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                    "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $iscc /? | Select-Object -First 2
      - name: Build the installer
        run: python installer/windows/build_installer.py
      - name: Smoke test (silent install, launch, UI, doctor, CPU render, uninstall)
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          ./installer/windows/ci_smoke.ps1 -Setup "installer/dist/SharkyClips-Setup-$v.exe" -Report installer/dist/smoke.json
      - name: Collect logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/dist/logs | Out-Null
          Copy-Item install.log installer/dist/logs/ -ErrorAction SilentlyContinue
          Copy-Item "$env:USERPROFILE/.sharkyclips/logs/*" installer/dist/logs/ -ErrorAction SilentlyContinue
      - name: Logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-logs
          path: |
            installer/dist/logs/
            installer/dist/smoke.json
          if-no-files-found: ignore
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          # the release is created right after the tag is pushed (CLAUDE.md release steps); wait for it
          for i in $(seq 1 60); do gh release view "v$v" >/dev/null 2>&1 && break; echo "waiting for release v$v ..."; sleep 30; done
          gh release upload "v$v" "installer/dist/SharkyClips-Setup-$v.exe" "installer/dist/SharkyClips-Setup-$v.exe.sha256" --clobber
          cat "installer/dist/SharkyClips-Setup-$v.exe.sha256"
          cat installer/dist/smoke.json
      - name: Installer as a build artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SharkyClips-Setup
          path: |
            installer/dist/SharkyClips-Setup-*.exe
            installer/dist/SharkyClips-Setup-*.exe.sha256
            installer/dist/smoke.json
          retention-days: 7
