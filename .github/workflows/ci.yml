name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hung runner (seen: apt-get) must not burn hours of minutes
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (without the big NVIDIA libraries)
        run: |
          grep -v nvidia backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt" -r backend/requirements-dev.txt
      - name: Install ffmpeg (the export tests encode with it)
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
      - uses: actions/setup-node@v4  # Node 24 runs frontend/src/previewMath.ts in test_preview_math.py
        with:
          node-version: 24
      - name: Lint (ruff)
        run: python -m ruff check backend installer
      - name: Bleep guarantee (end-to-end render, every swear bleeped)
        run: python -m pytest -q backend/tests/test_bleep_guarantee.py
      - name: Tests (pytest)
        run: python -m pytest

  backend-macos:
    # macOS runners are free for public repositories but cost 10x minutes on private ones, so
    # this job only runs while the repository is public. Required since 1.2.37.
    name: Backend (macOS)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install ffmpeg
        # the plain formula has no libass / freetype; ffmpeg-full is what install.sh sets up
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Installer dry run (macOS)
        run: bash install.sh --dry-run --lang en
      - name: macOS code paths load (idle time, front app, hardware, encoders)
        working-directory: backend
        run: |
          python - <<'PY'
          from sharkyclips import hardware, procs, render, sysmon
          u = sysmon.read_user()
          print("idle seconds:", u.idle_seconds, "front app:", u.fg_name)
          hw = hardware.detect_hardware()
          print(hw.os_name, hw.os_version, hw.arch, "apple silicon:", hw.apple_silicon)
          enc, notes = render.pick_encoder()
          print("encoder:", enc.name, notes)
          procs._darwin_bg(procs.os.getpid(), True)
          procs._darwin_bg(procs.os.getpid(), False)
          PY
      - name: Tests (pytest)
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Translations complete (7 languages)
        run: node scripts/check-i18n.mjs
      - name: Build
        run: npm run build

  layout:
    # Every screen at laptop / desktop / phone sizes, light + dark, Turkish / Arabic / English:
    # fails when panels overlap, a list is squeezed, content is cut off or the page scrolls
    # sideways (frontend/scripts/layout-check.mjs). Runs against the committed frontend/dist.
    name: Layout (no overlapping panels, preview = render)
    runs-on: ubuntu-24.04  # Playwright 1.55 can't install Chromium on ubuntu-latest (26.04) yet
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: |
          grep -v nvidia backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg (the fixture's playable test video for the preview check)
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install Playwright + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start SharkyClips on a synthetic project
        run: |
          PID=$(python frontend/scripts/layout-fixture.py "$RUNNER_TEMP/layout")
          echo "LAYOUT_PID=$PID" >> "$GITHUB_ENV"
          SHARKYCLIPS_HOME="$RUNNER_TEMP/layout/home" SHARKYCLIPS_NO_MIGRATE=1 SHARKYCLIPS_NO_BROWSER=1 \
            SHARKYCLIPS_PUBLISH_LOOP=0 SHARKYCLIPS_LIVE_LOOP=0 SHARKYCLIPS_SHARED_CLIENT="$RUNNER_TEMP/none.json" \
            nohup python backend/cli.py serve --port 8799 --no-browser > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/api/meta > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Layout check
        working-directory: frontend
        run: node scripts/layout-check.mjs http://127.0.0.1:8799 "$LAYOUT_PID" "$RUNNER_TEMP/layout-shots"
      - name: Preview matches the render plan
        working-directory: frontend
        run: node scripts/preview-check.mjs http://127.0.0.1:8799 "$LAYOUT_PID" "$RUNNER_TEMP/layout-shots"
      - name: Screenshots of failing views
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: ${{ runner.temp }}/layout-shots
          if-no-files-found: ignore

  installers:
    name: Installer scripts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem installer/windows/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Installer dry run (Windows PowerShell 5.1)
        shell: powershell
        run: ./installer/windows/install.ps1 -DryRun -Lang en
      - name: Shell scripts (shellcheck)
        shell: bash
        run: |
          python -m pip install shellcheck-py
          shellcheck -S warning install.sh installer/macos/uninstall.sh installer/macos/SharkyClips.command
