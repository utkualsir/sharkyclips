name: SharkyClips fixture server
description: >
  1.2.75 (docs/test-speed.md): the shared setup of the browser jobs. Python + Node (pip / npm cached),
  ffmpeg, Playwright with its browsers cached, the synthetic layout project and a SharkyClips server
  on port 8799. Sets LAYOUT_PID for the next steps.
inputs:
  browsers:
    description: Playwright browsers to install (space separated)
    default: chromium
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements*.txt
    - name: Install backend dependencies
      shell: bash
      run: |
        grep -v nvidia backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
        python -m pip install --upgrade pip
        python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install ffmpeg (the fixture's playable test video for the preview check)
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
    - name: npm ci
      shell: bash
      working-directory: frontend
      run: npm ci
    - name: Cache Playwright browsers
      id: pwcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ inputs.browsers }}
    - name: Install Playwright browsers (download skipped when cached)
      shell: bash
      working-directory: frontend
      run: |
        if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps ${{ inputs.browsers }}
        else
          npx playwright install --with-deps ${{ inputs.browsers }}
        fi
    - name: Start SharkyClips on a synthetic project
      shell: bash
      run: |
        PID=$(python frontend/scripts/layout-fixture.py "$RUNNER_TEMP/layout")
        echo "LAYOUT_PID=$PID" >> "$GITHUB_ENV"
        SHARKYCLIPS_HOME="$RUNNER_TEMP/layout/home" SHARKYCLIPS_NO_MIGRATE=1 SHARKYCLIPS_NO_BROWSER=1 \
          SHARKYCLIPS_PUBLISH_LOOP=0 SHARKYCLIPS_LIVE_LOOP=0 SHARKYCLIPS_SHARED_CLIENT="$RUNNER_TEMP/none.json" \
          SHARKYCLIPS_DOWNLOADS="$RUNNER_TEMP/layout/downloads" SHARKYCLIPS_QUEUE_HOME="$RUNNER_TEMP/layout/queue" \
          nohup python backend/cli.py serve --port 8799 --no-browser > "$RUNNER_TEMP/server.log" 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/api/meta > /dev/null && exit 0; sleep 1; done
        cat "$RUNNER_TEMP/server.log"; exit 1
