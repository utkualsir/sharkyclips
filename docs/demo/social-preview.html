<!doctype html>
<!-- GitHub social preview (1280x640). Rendered by docs/capture.mjs into docs/social-preview.png;
     upload it once in the repo's Settings -> General -> Social preview. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 600px at 85% 20%, #2a1a6e 0%, #0b1026 55%, #070a18 100%);
    font-family: "Segoe UI", "Inter", system-ui, sans-serif; color: #f4f6ff;
    display: grid; grid-template-columns: 560px 1fr; align-items: center;
  }
  .left { padding: 0 0 0 72px; }
  .logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px #0008; }
  h1 { font-size: 76px; margin: 22px 0 6px; letter-spacing: -1.5px; font-weight: 800; }
  .tag { font-size: 30px; line-height: 1.25; color: #c9d1ff; margin: 0 0 28px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 470px; }
  .chip { font-size: 19px; padding: 7px 14px; border-radius: 999px; background: #ffffff14; border: 1px solid #ffffff26; }
  .right { position: relative; height: 640px; }
  .shot { position: absolute; left: 10px; top: 92px; width: 860px; border-radius: 16px;
          box-shadow: 0 24px 80px #000a; border: 1px solid #ffffff22; }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="../../assets/icon/sharkyclips.png" alt="">
    <h1>SharkyClips</h1>
    <p class="tag">Your stream in, ready-to-post Shorts out.<br>Free, and 100% on your own PC.</p>
    <div class="chips">
      <span class="chip">Twitch · YouTube · Kick</span>
      <span class="chip">Game-aware</span>
      <span class="chip">Bleeps, checked</span>
      <span class="chip">YouTube · TikTok · Reels</span>
      <span class="chip">7 languages</span>
    </div>
  </div>
  <div class="right"><img class="shot" src="../screenshots/easy-project-dark.png" alt=""></div>
</body>
</html>
