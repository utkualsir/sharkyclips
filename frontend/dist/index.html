    <script>
      // Theme + language before first paint (no flash). Both are remembered per browser.
      (function () {
        try {
          var t = localStorage.getItem("cf-theme");
          if (t !== "light" && t !== "dark")
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("cf-lang") || "tr";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
          // Animation level (Settings > Animations), capped by the OS reduce-motion setting.
          var m = localStorage.getItem("sc-motion") || "full";
          if (m !== "off" && (m === "reduced" || window.matchMedia("(prefers-reduced-motion: reduce)").matches)) m = "reduced";
          document.documentElement.setAttribute("data-motion", m === "off" ? "off" : m === "reduced" ? "reduced" : "full");
          // Coming from the launcher's splash page: paint its last frame at once (#boot-launch),
          // the app then flies the logo into the header (components/Launch.tsx).
          if (/[?&]splash=done/.test(location.search)) document.documentElement.classList.add("boot-handover");
        } catch (e) {}
      })();
    </script>
